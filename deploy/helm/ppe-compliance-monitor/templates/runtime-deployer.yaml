{{- if .Values.runtimeDeployer.enabled }}
{{- $fullName := include "ppe-compliance-monitor.fullname" . }}
{{- $saName := printf "%s-runtime-deployer" $fullName }}
{{- $podTemplate := include "ppe-compliance-monitor.runtimeDeployerPodTemplate" . }}
{{- /* Jobs cannot update their Pod templates. Also rerun when managed credentials rotate. */}}
{{- $jobHash := printf "%s:%s" $podTemplate (toJson .Values.s3Credentials) | sha256sum | trunc 8 }}
#
# ──────────────────────────────────────────────
# 1. SecurityContextConstraints
# ──────────────────────────────────────────────

{{- if .Values.runtimeDeployer.scc.enabled }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ $saName }}-scc
  labels:
    {{- include "ppe-compliance-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-deployer
allowPrivilegeEscalation: false
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
users:
  - system:serviceaccount:{{ .Release.Namespace }}:{{ $saName }}
{{- end }}

---
# ──────────────────────────────────────────────
# 2. ServiceAccount
# ──────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- include "ppe-compliance-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-deployer

---
# ──────────────────────────────────────────────
# 3. Role  –  permissions for create_runtime.py
# ──────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  labels:
    {{- include "ppe-compliance-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-deployer
rules:
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["servingruntimes", "inferenceservices"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

---
# ──────────────────────────────────────────────
# 4. RoleBinding
# ──────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  labels:
    {{- include "ppe-compliance-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}

{{- if .Values.runtimeDeployer.scc.enabled }}
---
# ──────────────────────────────────────────────
# 5. RoleBinding  –  SCC
# ──────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}-scc
  labels:
    {{- include "ppe-compliance-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ $saName }}-scc
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end }}

---
# ──────────────────────────────────────────────
# 6. Job  –  runs create_runtime.py
# ──────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" ($saName | trunc 54 | trimSuffix "-") $jobHash }}
  labels:
    {{- include "ppe-compliance-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-deployer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    {{- $podTemplate | nindent 4 }}
{{- end }}
